# rules.yml, dibaca build.py. Nomor folder = posisi di daftar (folders lalu archive), selalu 2 digit.

files:
  status_lokal: status_lokal.json     # hasil check_local.py (jaringan MyRepublic)
  status_github: status_github.json   # hasil cek harian GitHub (Batch 3)
  radio_cache: radio_cache.json       # cache Radio Browser (Batch 3)
  epg_ids: epg_ids.txt                # dibuat epg_check.py

# EPG: off = header '#EXTM3U' polos, tvg-id asli. single = url-tvg + remap tvg-id ke id yang ada di epg_ids.txt
epg:
  mode: single
  url: https://styleb0yz.github.io/iptv-playlist/epg.xml   # header url-tvg playlist = hasil gabungan dhanytv + mjh
  # Sumber EPG untuk epg_merge.py (dipakai workflow GitHub). Urutan = prioritas: kalau satu id ada di dua sumber, sumber pertama menang.
  # Kalau sumber > 1, ganti 'url' di atas ke https://USER.github.io/iptv-playlist/epg.xml (hasil gabungan) setelah Pages hidup.
  sources:
    - https://raw.githubusercontent.com/dhasap/dhanytv/main/epg.xml
    - /tmp/epg_mjh.xml   # dibuat epg_mjh.py (i.mjh.nz); kalau file tidak ada, dilewati

# Suffix @... iptv-org: hanya yang cocok regex ini dianggap varian channel yang sama (HD/SD dst).
quality_suffix: '^(\d{3,4}[pi]?|hd|sd|fhd|uhd|4k|hq|lq)$'
dhanytv_loser: report        # report = dicatat saja; archive = ikut masuk archive
dead_exempt_countries: [id]  # cek GitHub tidak memindah channel negara ini
github_dead_after_fails: 2   # cek GitHub baru memindah ke Likely Dead setelah gagal N hari berturut-turut
gap_require_local: false     # false = kandidat gap langsung masuk; yang gagal cek lokal -> Likely Dead

# Folder esensial (01-15). csv = teks folder di draft_esensial.csv. Urutan di sini = urutan final.
folders:
  - {key: national,  csv: "01 · Indonesia · TV Nasional",        label: "Indonesia National TV"}
  - {key: news,      csv: "02 · Indonesia · Berita",             label: "Indonesia News"}
  - {key: islam,     csv: "04 · Islam · Indonesia & Haramain",   label: "Islamic TV (Indonesia & Haramain)"}
  - {key: sports,    csv: "06 · Bola & Olahraga Umum",           label: "Football & Sports"}
  - {key: sports2,   csv: "07 · NBA, Golf, Rugby & Lainnya",     label: "More Sports (NBA, Golf, Rugby)"}
  - {key: movies,    csv: "05 · Film & Series",                  label: "Movies & Series"}
  - {key: docs,      csv: "14 · Dokumenter & Sains",             label: "Documentary & Science"}
  - {key: intl_news, csv: "08 · Berita Internasional",          label: "International News"}
  - {key: kids,      csv: "12 · Anak & Kartun",                  label: "Kids & Cartoons"}
  - {key: america,   csv: "09 · Amerika · TV & Kabel",           label: "USA TV & Cable"}
  - {key: uk,        csv: "10 · Inggris · TV Utama",             label: "UK TV"}
  - {key: europe,    csv: "11 · Eropa · TV Utama",               label: "Europe TV"}
  - {key: music,     csv: "13 · Musik",                          label: "Music"}
  - {key: tvri,      csv: "03 · Indonesia · TVRI Daerah",        label: "Indonesia TVRI Regional"}
  - {key: radio,     csv: "15 · Radio",                          label: "Radio"}

