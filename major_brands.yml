# major_brands.yml, dibaca refill.py. Daftar merek channel mayor yang dicari di SEMUA entri sumber (index + dhanytv + extra).
# Tiap baris: n = nama tampil di playlist, a = daftar nama persis (regex kecil) yang diterima, f = key folder di rules.yml.
# Nama disamakan dulu: huruf kecil, tanda baca jadi spasi, '&' jadi 'and', '+' jadi 'plus', tag (720p) dan [Geo-blocked] dibuang.
# Nama channel harus SAMA PERSIS dengan salah satu alias, boleh diikuti kata sufiks dari suffix_words (hd, asia, us, latin america, dst).
# Jadi 'HBO Family Asia HD' cocok dengan alias 'hbo family', tapi 'HBO Hungary' dan 'ABC KGTV' tidak.
# Opsional: r = wilayah yang boleh untuk merek itu (menimpa allowed_regions), x = regex pengecualian.

region_order: [asia, us, uk, eu, other, latam]   # urutan pilih varian kalau lebih dari satu lolos tes (Asia dekat Indonesia, lalu US berbahasa Inggris, lalu Latin America)
keep_per_brand: 1                               # berapa varian lolos yang dinaikkan per merek

# Kata di nama/tvg-id yang menentukan wilayah varian
region_hints:
  asia:  ['\basia\b', '\bsoutheast\b', '\bsea\b', '\bphilippines\b', '\bsingapore\b', '\bmalaysia\b', '\bindonesia\b', '\bthailand\b', '\bhong ?kong\b', '\bindia\b', '\bkorea\b', '\bjapan\b', '\btaiwan\b', '\bvietnam\b']
  latam: ['\blatin', '\blatam\b', '\bandes\b', '\bcolombia\b', '\bmexico\b', '\bargentina\b', '\bchile\b', '\bperu\b', '\bbrasil\b', '\bbrazil\b', '\bsouth\b']
  uk:    ['\buk\b', '\bunited kingdom\b', '\bbritain\b']
  us:    ['\bunited states\b', '\busa\b', '\bus\b', '\bamerica\b']
  eu:    ['\beurope\b', '\bgermany\b', '\bfrance\b', '\bitaly\b', '\bspain\b', '\bportugal\b', '\bnetherlands\b', '\bpoland\b', '\bhungary\b', '\bczech', '\bromania\b', '\bbulgaria\b', '\bsweden\b', '\bdenmark\b', '\bnorway\b', '\bturk', '\brussia\b', '\bukraine\b']
region_cc:   # kode negara dari tvg-id (.xx)
  asia:  [id, my, sg, th, ph, vn, hk, in, kr, jp, tw, cn, pk, bd, lk, mm, kh, la, bn, mo]
  latam: [mx, ar, cl, co, pe, ve, ec, br, uy, py, bo, cr, gt, hn, pa, do, sv, ni]
  us:    [us, ca]
  uk:    [uk, gb, ie]
  eu:    [de, fr, it, es, nl, pl, se, pt, at, ch, be, dk, no, fi, gr, cz, hu, ro, bg, sk, hr, rs, ua, ru, tr]


# Kata yang boleh menempel setelah alias (tanpa ini nama tidak cocok). Negara Eropa dan Australia sengaja TIDAK ada di sini.
suffix_words: [hd, fhd, uhd, sd, 4k, channel, network, international, intl, live, asia, southeast, sea, indonesia, india, philippines,
  singapore, malaysia, thailand, taiwan, korea, japan, hong, kong, vietnam, pacific, latin, america, latam, andes, south, colombia,
  mexico, brazil, brasil, argentina, chile, peru, us, usa, united, states, uk, kingdom, canada, english, east, west, europe, vision, plus,
  id, my, sg, th, ph, vn, hk, jp, tw, kr, mx, ar, cl, co, pe, br, ca, pluto tv]

# Wilayah yang diterima per folder (kecuali merek punya r). 'foreign' = kode negara di tvg-id di luar daftar wilayah.
allowed_regions:
  default: [asia, us, latam, uk, other]
  uk: [uk]
  europe: [eu, other]
  intl_news: [asia, us, latam, uk, eu, other]

